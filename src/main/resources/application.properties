# Database Configuration
spring.datasource.url=jdbc:h2:mem:plataformaempregos;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Swagger Configuration
springfox.documentation.swagger.v2.path=/api-docs

# JWT Configuration
jwt.secret=plataforma-empregos-secret-key-change-in-production-environment
jwt.expiration=86400000

# AI Configuration
ai.enabled=true
ai.api.url=
ai.api.key=

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Didit Device & IP Analysis Configuration
didit.enabled=true
didit.api.url=https://verification.didit.me
didit.api.key=YOUR_DIDIT_API_KEY
didit.workflow.id=YOUR_DIDIT_WORKFLOW_ID
didit.callback.base-url=http://localhost:8080/api/didit

# Didit Fraud Policy
didit.fraud-policy.vpn-detected=MANUAL_REVIEW
didit.fraud-policy.proxy-detected=MANUAL_REVIEW
didit.fraud-policy.tor-detected=DECLINE
didit.fraud-policy.datacenter-ip=MANUAL_REVIEW
didit.fraud-policy.high-risk-country=MANUAL_REVIEW
didit.fraud-policy.location-mismatch=MANUAL_REVIEW
didit.fraud-policy.duplicated-device=MANUAL_REVIEW
didit.fraud-policy.impossible-travel=MANUAL_REVIEW
didit.fraud-policy.blocklisted-device=DECLINE


